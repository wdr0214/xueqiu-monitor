name: Verify Xueqiu Prices (No Push)
on:
  push:
    paths:
      - ".github/workflows/verify-prices.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      XUEQIU_COOKIE: ${{ secrets.XUEQIU_COOKIE }}
      XUEQIU_URL: ${{ secrets.XUEQIU_URL }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Read records and verify actual prices without sending
        run: |
          python - <<'PY'
          import json, os
          import monitor
          from urllib.parse import urlparse
          original_request = monitor.request_json
          def read_only(url, **kwargs):
              assert urlparse(url).hostname == "xueqiu.com"
              assert kwargs.get("method", "GET") == "GET"
              return original_request(url, **kwargs)
          monitor.request_json = read_only
          failures = []
          for url in [os.environ["XUEQIU_URL"], "https://xueqiu.com/p/ZH3388446"]:
              config = monitor.Config(url, "", "", (), "", os.environ["XUEQIU_COOKIE"])
              monitor.random_delay()
              try:
                  records = monitor.fetch_rebalance_records(config)
                  if not records:
                      raise ValueError("No rebalance records returned")
                  latest = max(records, key=lambda r: monitor.record_sort_key(r, monitor.record_id(r, 0)))
                  changes = monitor.extract_changes_from_record(latest)
                  priced = [c for c in changes if monitor.parse_float(c["price"]) is not None and float(c["price"]) > 0]
                  print(json.dumps({"cube":config.cube_symbol,"record_count":len(records),"latest_id":latest.get("id"),"changes":changes,"priced_count":len(priced)}, ensure_ascii=False))
                  if not changes or len(priced) != len(changes):
                      failures.append(config.cube_symbol + ": incomplete prices")
              except Exception as exc:
                  print(config.cube_symbol, type(exc).__name__, str(exc))
                  failures.append(config.cube_symbol + ": request failed")
          print("No WeChat requests. No history writes.")
          if failures:
              raise SystemExit("; ".join(failures))
          PY
