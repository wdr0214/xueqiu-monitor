name: Xueqiu Cube Monitor

on:
  schedule:
    # GitHub Actions cron uses UTC. These map to Asia/Shanghai 09:00-15:55 and 16:00.
    - cron: "*/5 1-7 * * 1-5"
    - cron: "0 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xueqiu-cube-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai
      POLL_START: "09:00"
      POLL_END: "16:00"
      HISTORY_FILE: history.json
      SEND_INITIAL_REBALANCE: "true"
      XUEQIU_URL: ${{ secrets.XUEQIU_URL }}
      EXTRA_XUEQIU_URLS: https://xueqiu.com/p/ZH3388446
      XUEQIU_COOKIE: ${{ secrets.XUEQIU_COOKIE }}
      WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
      WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
      WECHAT_TO_OPENID: ${{ secrets.WECHAT_TO_OPENID }}
      WECHAT_TO_OPENIDS: ${{ secrets.WECHAT_TO_OPENIDS }}
      WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Print trigger context
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "trigger_event=${TRIGGER_EVENT}"
          if [ -n "${TRIGGER_SCHEDULE}" ]; then
            echo "trigger_schedule=${TRIGGER_SCHEDULE}"
          else
            echo "trigger_schedule=workflow_dispatch_or_api"
          fi

      - name: Run monitor
        run: python monitor.py

      - name: Persist history
        if: always()
        run: |
          if git diff --quiet -- history.json; then
            echo "history.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -m "chore: update xueqiu monitor history"
          git push
